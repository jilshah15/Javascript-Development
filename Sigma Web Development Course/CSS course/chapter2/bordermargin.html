<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
</head>
<style>
.box{
   color:blueviolet;
}
.box1{
   background-color: bisque;
   padding: 10px;
   margin:10px;
   border:1px solid red;
   height: 200px;
   box-sizing:border-box;
}
.box2{
  background-color:yellow;
   padding: 10px;
   margin:30px;
   border:1px solid red;
   height: 200px;
   box-sizing:border-box;

}
</style>
<body>
    <div class="box box1">I am a box1.</div>
    <div class="box box2">I am a box2.</div>
</body>
</html>
